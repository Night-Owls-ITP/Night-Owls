name: Pruebas de autenticación

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        id: dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test -- --ci --runInBand --verbose --runTestsByPath src/auth/authentication.service.spec.ts

      - name: Pruebas de integración HTTP
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm test -- --ci --runInBand --verbose --runTestsByPath src/auth/roles-http.spec.ts
